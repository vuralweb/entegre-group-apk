<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10243a">
<title>ENTEGRE GROUP | Bakım Yönetimi</title>
<style>
:root{--navy:#10243a;--blue:#1769aa;--bg:#f3f6fa;--card:#fff;--ink:#182536;--muted:#718096;--line:#e5ebf2;--green:#16845b;--orange:#bd7414;--red:#c44747}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}
header{background:linear-gradient(135deg,#10243a,#194d72);color:#fff;padding:20px 17px 18px;border-radius:0 0 22px 22px}
.brand{font-size:11px;letter-spacing:2px;opacity:.8;font-weight:800}.head{display:flex;justify-content:space-between;align-items:center;margin-top:8px}h1{font-size:22px;margin:0}.sub{font-size:12px;opacity:.75;margin-top:4px}.avatar{width:42px;height:42px;border-radius:14px;background:#ffffff20;display:grid;place-items:center;font-weight:800}
main{max-width:850px;margin:auto;padding:14px 13px 100px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:12px 0 18px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px;box-shadow:0 3px 12px #12243a08}.stat .n{font-size:24px;font-weight:850;color:var(--navy)}.stat .l{font-size:11px;color:var(--muted);margin-top:2px}
.section{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:19px 2px 11px}.section h2{font-size:16px;margin:0}.muted{color:var(--muted);font-size:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.card{margin-bottom:9px}.card h3{font-size:14px;margin:0 0 5px}.meta{font-size:11px;color:var(--muted);line-height:1.65;overflow-wrap:anywhere}
.pill{font-size:10px;font-weight:800;padding:5px 8px;border-radius:30px;background:#edf3f8;color:#486176;white-space:nowrap}.ok{background:#e5f5ee;color:var(--green)}.warn{background:#fff3df;color:var(--orange)}.bad{background:#fdeaea;color:var(--red)}
button{border:0;border-radius:11px;padding:10px 12px;background:var(--blue);color:white;font-weight:750;font-size:12px;cursor:pointer}button.secondary{background:#edf3f8;color:#23435e}button.ghost{background:transparent;color:var(--blue);padding:7px}button.danger{background:#fdeaea;color:#a52f2f}.small{padding:7px 9px;font-size:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;overflow-x:auto;z-index:5;padding:7px 3px calc(7px + env(safe-area-inset-bottom));justify-content:space-around}
.nav{background:transparent;color:#66788a;padding:6px 7px;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:55px}.nav b{font-size:17px}.nav.active{color:var(--blue)}
input,select,textarea{width:100%;padding:11px;border:1px solid #dce4ed;border-radius:10px;background:#fff;font:inherit;font-size:13px;color:var(--ink);margin:5px 0 11px}
label{font-size:11px;font-weight:800;color:#526477;display:block}textarea{min-height:65px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.full{grid-column:1/-1}
.toolbar{display:flex;gap:7px;margin:10px 0}.toolbar input{margin:0}.empty{text-align:center;padding:25px 12px;color:var(--muted);font-size:12px}
.modal{position:fixed;inset:0;background:#0b1b2dcc;display:flex;align-items:flex-end;z-index:10}.hidden{display:none!important}.sheet{background:#f7f9fc;width:100%;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 15px 28px}.sheettop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheettop h2{font-size:17px;margin:0}.close{background:#e7edf4;color:#345}
.notice{background:#fff7e8;border:1px solid #f4dfb6;border-radius:12px;padding:10px;font-size:10px;color:#805b1d;line-height:1.5;margin:12px 0}.money{font-weight:850;color:var(--navy)}.tabs{display:flex;gap:6px;overflow:auto;margin:10px 0}.tabs button{white-space:nowrap}.tabs .secondary{background:#fff;border:1px solid var(--line)}
@media(min-width:650px){.stats{grid-template-columns:repeat(4,1fr)}main{padding-top:20px}.modal{align-items:center;justify-content:center}.sheet{max-width:590px;border-radius:20px}.bottom{max-width:850px;left:50%;transform:translateX(-50%);border-radius:15px 15px 0 0}}
</style></head>
<body>
<header><div class="brand">ENTEGRE GROUP</div><div class="head"><div><h1>Bakım Yönetim Paneli</h1><div class="sub">Asansör bakım · arıza · tahsilat takibi</div></div><div class="avatar">EG</div></div></header>
<main id="app"></main>
<nav class="bottom">
<button class="nav active" data-tab="home"><b>⌂</b>Ana Sayfa</button><button class="nav" data-tab="buildings"><b>▦</b>Binalar</button><button class="nav" data-tab="maintenance"><b>✓</b>Bakım</button><button class="nav" data-tab="faults"><b>⚒</b>Arıza</button><button class="nav" data-tab="finance"><b>₺</b>Finans</button><button class="nav" data-tab="materials"><b>▤</b>Parça</button><button class="nav" data-tab="settings"><b>⚙</b>Ayarlar</button>
</nav>
<div id="modal" class="modal hidden"><div class="sheet"><div class="sheettop"><h2 id="modalTitle">Yeni kayıt</h2><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
const KEY='entegre_group_local_v2';
const fresh=()=>({buildings:[],elevators:[],maintenance:[],faults:[],bills:[],payments:[],materials:[],usage:[],staff:['Süleyman Emdirme'],settings:{company:'ENTEGRE GROUP',phone:'05302781891',district:'Beylikdüzü',manager:'Süleyman Emdirme'}});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){db=fresh()}
for(const k of Object.keys(fresh())) if(db[k]===undefined)db[k]=fresh()[k];
let tab='home';
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(Number(n)||0).toLocaleString('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2});
const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const monthKey=(d=today())=>d.slice(0,7);
const badge=s=>`<span class="pill ${['Tamamlandı','Ödendi'].includes(s)?'ok':['Gecikti','Açık'].includes(s)?'bad':'warn'}">${esc(s||'Bekliyor')}</span>`;
const building=id=>db.buildings.find(x=>x.id===Number(id));
const elevatorsFor=id=>db.elevators.filter(x=>x.buildingId===Number(id));
const dueBills=()=>db.bills.reduce((a,x)=>a+Math.max(0,(+x.amount||0)-(+x.paid||0)),0);
function makeMonthly(){
 const mk=monthKey(), now=today();
 db.buildings.filter(b=>b.contract==='Aktif').forEach(b=>{
  let exists=db.bills.some(x=>x.buildingId===b.id&&x.month===mk);
  if(!exists){let count=elevatorsFor(b.id).length||Number(b.elevators)||1;let amount=Number(b.fee||0)*(b.pricing==='Asansör başına'?count:1);
   db.bills.push({id:Date.now()+Math.floor(Math.random()*100000),buildingId:b.id,building:b.name,month:mk,amount,paid:0,due:mk+'-30',status:'Bekliyor'});
  }
  elevatorsFor(b.id).forEach(el=>{if(!db.maintenance.some(m=>m.elevatorId===el.id&&m.month===mk)){db.maintenance.push({id:Date.now()+Math.floor(Math.random()*100000),buildingId:b.id,building:b.name,elevatorId:el.id,elevator:el.label,date:mk+'-01',month:mk,staff:'Süleyman Emdirme',notes:'Aylık bakım',status:'Bekliyor',auto:true})}});
 });
 db.bills.forEach(x=>{if((+x.paid||0)>=(+x.amount||0))x.status='Ödendi';else if(x.due<now)x.status='Gecikti';else x.status='Bekliyor'});
 save();
}
function render(){
 makeMonthly();
 document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));
 let root=document.getElementById('app');
 if(tab==='home'){
  let openM=db.maintenance.filter(x=>x.status!=='Tamamlandı').length,openF=db.faults.filter(x=>x.status!=='Tamamlandı').length;
  root.innerHTML=`<div class="stats"><div class="stat"><div class="n">${db.buildings.length}</div><div class="l">Kayıtlı bina</div></div><div class="stat"><div class="n">${db.elevators.length}</div><div class="l">Asansör</div></div><div class="stat"><div class="n">${openM}</div><div class="l">Bekleyen bakım</div></div><div class="stat"><div class="n">${openF}</div><div class="l">Açık arıza</div></div></div>
  <div class="card"><div class="row"><div><div class="muted">Toplam açık bakiye</div><div class="money" style="font-size:24px">${money(dueBills())}</div></div><span class="pill warn">${db.bills.filter(x=>x.status!=='Ödendi').length} açık borç</span></div></div>
  <div class="section"><h2>Hızlı işlemler</h2><span class="muted">Bu telefon</span></div><div class="card"><div class="actions"><button onclick="openForm('building')">＋ Bina ekle</button><button class="secondary" onclick="openForm('maintenance')">＋ Bakım</button><button class="secondary" onclick="openForm('fault')">＋ Arıza</button><button class="secondary" onclick="openForm('payment')">＋ Tahsilat</button></div></div>
  <div class="section"><h2>Son işlemler</h2><span class="muted">En yeni kayıtlar</span></div>${recent()}
  <div class="notice">Bilgi: Bu sürüm tek telefonun tarayıcı hafızasında çalışır. Her ayın ilk açılışında aktif sözleşmeli binalar için aylık bakım borcu ve asansör bazlı bakım kaydı oluşturulur. Verilerini düzenli olarak Ayarlar bölümünden yedekle.</div>`;
 }
 if(tab==='buildings')root.innerHTML=`<div class="section"><h2>Bina kayıtları</h2><button onclick="openForm('building')">＋ Yeni bina</button></div><div class="toolbar"><input id="search" placeholder="Bina, mahalle veya ilçe ara..." oninput="filterBuildings()"></div><div id="buildingList">${buildingCards(db.buildings)}</div>`;
 if(tab==='maintenance')root.innerHTML=`<div class="section"><h2>Bakım kayıtları</h2><button onclick="openForm('maintenance')">＋ Bakım ekle</button></div>${db.maintenance.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="card"><div class="row"><h3>${esc(x.building)} · ${esc(x.elevator||'Asansör')}</h3>${badge(x.status)}</div><div class="meta">${esc(x.date)} · ${esc(x.staff||'-')}<br>${esc(x.notes||'Açıklama yok')}</div><div class="actions"><button class="secondary small" onclick="toggleStatus('maintenance',${x.id})">Durum değiştir</button><button class="ghost small" onclick="removeItem('maintenance',${x.id})">Sil</button></div></div>`).join('')||'<div class="empty">Henüz bakım kaydı yok.</div>'}`;
 if(tab==='faults')root.innerHTML=`<div class="section"><h2>Arıza kayıtları</h2><button onclick="openForm('fault')">＋ Arıza ekle</button></div>${db.faults.slice().reverse().map(x=>`<div class="card"><div class="row"><h3>${esc(x.building)} · ${esc(x.elevator||'Asansör')}</h3>${badge(x.status)}</div><div class="meta">${esc(x.type)} · ${esc(x.date)} · ${esc(x.staff||'-')}<br>${esc(x.notes||'')}<br>Parça: ${esc(x.parts||'-')} · Ücret: ${money(x.fee)}</div><div class="actions"><button class="secondary small" onclick="toggleStatus('faults',${x.id})">Durum değiştir</button><button class="ghost small" onclick="removeItem('faults',${x.id})">Sil</button></div></div>`).join('')||'<div class="empty">Henüz arıza kaydı yok.</div>'}`;
 if(tab==='finance'){
  let collected=db.payments.reduce((a,x)=>a+(+x.amount||0),0);
  root.innerHTML=`<div class="section"><h2>Finans ve tahsilat</h2><button onclick="openForm('payment')">＋ Tahsilat</button></div><div class="stats"><div class="stat"><div class="n">${money(dueBills())}</div><div class="l">Açık bakiye</div></div><div class="stat"><div class="n">${money(collected)}</div><div class="l">Toplam tahsilat</div></div></div><div class="section"><h2>Aylık bakım borçları</h2><span class="muted">Son ödeme: ayın 30'u</span></div>${db.bills.slice().sort((a,b)=>b.month.localeCompare(a.month)).map(x=>`<div class="card"><div class="row"><h3>${esc(x.building)} · ${esc(x.month)}</h3>${badge(x.status)}</div><div class="meta">Borç: ${money(x.amount)} · Ödenen: ${money(x.paid)}<br>Kalan: <b>${money(Math.max(0,x.amount-x.paid))}</b> · Son ödeme: ${esc(x.due)}</div><div class="actions"><button class="small" onclick="openForm('billpayment',${x.id})">Ödeme al</button></div></div>`).join('')||'<div class="empty">Henüz borç yok. Aktif sözleşmeli bina eklediğinde aylık borç oluşturulur.</div>'}`;}
 if(tab==='materials')root.innerHTML=`<div class="section"><h2>Parça / malzeme</h2><button onclick="openForm('material')">＋ Malzeme ekle</button></div>${db.materials.map(x=>`<div class="card"><div class="row"><h3>${esc(x.name)}</h3><span class="pill">${esc(x.qty)} ${esc(x.unit)}</span></div><div class="meta">Kod: ${esc(x.code||'-')} · Asgari stok: ${esc(x.min||0)}</div><div class="actions"><button class="secondary small" onclick="openForm('usage',${x.id})">Kullanım kaydı</button><button class="ghost small" onclick="removeItem('materials',${x.id})">Sil</button></div></div>`).join('')||'<div class="empty">Henüz malzeme eklenmedi.</div>'}${db.usage.length?`<div class="section"><h2>Son malzeme hareketleri</h2></div>`+db.usage.slice().reverse().slice(0,15).map(x=>`<div class="card"><div class="meta">${esc(x.date)} · ${esc(x.material)} · ${esc(x.qty)} ${esc(x.unit)} · ${esc(x.building||'')}</div></div>`).join(''):''}`;
 if(tab==='settings')root.innerHTML=`<div class="section"><h2>Ayarlar ve yedekleme</h2></div><div class="card"><h3>Firma bilgileri</h3><div class="meta">${esc(db.settings.company)}<br>${esc(db.settings.manager)} · ${esc(db.settings.phone)}<br>İstanbul / ${esc(db.settings.district)}</div></div><div class="card"><h3>Veri yedekleme</h3><div class="meta">Yedek dosyası bina, asansör, bakım, arıza, borç, tahsilat ve stok kayıtlarını içerir.</div><div class="actions"><button onclick="backup()">Yedeği indir</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">Yedekten geri yükle</button><input id="restoreFile" class="hidden" type="file" accept="application/json" onchange="restoreBackup(event)"></div></div><div class="card"><h3>Personel adı</h3><div class="meta">Tek telefon sürümünde işlem kayıtlarında görünen personel adı.</div><input id="staffName" value="${esc(db.staff[0]||'Süleyman Emdirme')}"><button onclick="saveStaff()">Personel adını kaydet</button></div><div class="notice">Önemli: Bu sürüm APK değildir. Dosyayı Chrome'da açarak kullanabilirsin; ana ekrana uygulama gibi eklemek için dosyanın HTTPS üzerinden yayınlanması gerekir. Telefon değişirse yedek dosyanı yeni telefona aktar.</div><button class="danger" onclick="resetAll()">Tüm verileri sil</button>`;
}
function recent(){let a=[...db.maintenance.map(x=>({...x,k:'Bakım'})),...db.faults.map(x=>({...x,k:'Arıza'})),...db.payments.map(x=>({...x,k:'Tahsilat'}))].sort((x,y)=>y.id-x.id).slice(0,5);return a.map(x=>`<div class="card"><div class="row"><div><h3>${x.k} · ${esc(x.building)}</h3><div class="meta">${esc(x.date||'')}</div></div>${x.k==='Tahsilat'?`<b>${money(x.amount)}</b>`:badge(x.status)}</div></div>`).join('')||'<div class="empty">Henüz işlem yok. İlk binanı ekleyerek başla.</div>'}
function buildingCards(arr){return arr.map(b=>`<div class="card"><div class="row"><h3>${esc(b.name)}</h3><span class="pill">${elevatorsFor(b.id).length} asansör</span></div><div class="meta">${esc(b.district)} · ${esc(b.neighborhood)}<br>${esc(b.address)}<br>Yönetici: ${esc(b.manager||'-')} · ${esc(b.phone||'-')}<br>Bakım: ${esc(b.contract)} · ${esc(b.pricing)} · ${money(b.fee)}</div><div class="actions"><button class="secondary small" onclick="openForm('elevator',${b.id})">Asansörleri düzenle</button><button class="secondary small" onclick="openForm('maintenance',${b.id})">Bakım ekle</button><button class="secondary small" onclick="openForm('fault',${b.id})">Arıza ekle</button><button class="ghost small" onclick="removeItem('buildings',${b.id})">Sil</button></div><div class="meta" style="margin-top:8px">${elevatorsFor(b.id).map(e=>'• '+esc(e.label)+' — '+esc(e.brand||'Marka belirtilmedi')).join('<br>')}</div></div>`).join('')||'<div class="empty">Henüz bina eklenmedi. “Yeni bina” ile başlayabilirsin.</div>'}
function filterBuildings(){let q=document.getElementById('search').value.toLocaleLowerCase('tr');document.getElementById('buildingList').innerHTML=buildingCards(db.buildings.filter(x=>(x.name+' '+x.district+' '+x.neighborhood+' '+x.address).toLocaleLowerCase('tr').includes(q)))}
function openModal(t,b){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=b;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function optsBuildings(id){return db.buildings.map(b=>`<option value="${b.id}" ${b.id===id?'selected':''}>${esc(b.name)}</option>`).join('')}
function optsElevators(bid){return elevatorsFor(bid).map(e=>`<option value="${e.id}">${esc(e.label)}</option>`).join('')}
function openForm(type,id){
 let body='',b=building(id),title='';
 if(type==='building'){title='Yeni bina kaydı';body=`<form onsubmit="addBuilding(event)"><label>Bina adı *</label><input name="name" required placeholder="Örn. Güneş Apartmanı"><div class="grid"><div><label>İlçe</label><input name="district" value="Beylikdüzü"></div><div><label>Mahalle</label><input name="neighborhood"></div><div class="full"><label>Açık adres</label><textarea name="address"></textarea></div><div><label>Yönetici adı</label><input name="manager"></div><div><label>Telefon</label><input name="phone" type="tel"></div><div><label>Asansör sayısı</label><input name="elevators" type="number" min="1" value="1"></div><div><label>Ücret (₺)</label><input name="fee" type="number" min="0" step=".01" value="0"></div></div><label>Ücretlendirme</label><select name="pricing"><option>Bina başına</option><option>Asansör başına</option></select><label>Bakım sözleşmesi</label><select name="contract"><option>Aktif</option><option>Pasif</option></select><button style="width:100%">Binayı kaydet</button></form>`}
 if(type==='elevator'){if(!b)return;title='Asansör envanteri';body=`<div class="meta">${esc(b.name)} için asansörleri aşağıdan düzenle.</div><form onsubmit="saveElevators(event,${b.id})"><div id="elevatorFields">${elevatorsFor(b.id).map((e,i)=>`<div class="card"><label>Asansör ${i+1} adı / numarası</label><input name="label[]" value="${esc(e.label)}"><label>Marka / model</label><input name="brand[]" value="${esc(e.brand||'')}"></div>`).join('')}</div><button type="button" class="secondary" onclick="addElevatorField()">＋ Asansör satırı ekle</button><button style="width:100%;margin-top:10px">Asansörleri kaydet</button></form>`}
 if(['maintenance','fault','payment'].includes(type)){if(!db.buildings.length){openModal('Önce bina eklemelisin','<div class="empty">Bu işlem için önce bir bina kaydet.</div><button onclick="closeModal();openForm(&quot;building&quot;)">Bina ekle</button>');return}
 title=type==='maintenance'?'Bakım kaydı':type==='fault'?'Arıza kaydı':'Tahsilat kaydı';
 body=`<form onsubmit="addRecord(event,'${type}')"><label>Bina *</label><select name="buildingId" required onchange="refreshElevatorOptions(this)">${optsBuildings(id)}</select><label>Asansör</label><select name="elevatorId"><option value="">Seçiniz</option>${optsElevators(id||db.buildings[0].id)}</select><div class="grid"><div><label>Tarih</label><input name="date" type="date" value="${today()}"></div><div><label>Personel</label><input name="staff" value="${esc(db.staff[0]||'Süleyman Emdirme')}"></div></div>`;
 if(type==='maintenance')body+=`<label>Yapılan işlemler / açıklama</label><textarea name="notes"></textarea><label>Durum</label><select name="status"><option>Bekliyor</option><option>Tamamlandı</option><option>Gecikti</option></select>`;
 if(type==='fault')body+=`<label>Arıza türü</label><input name="type" placeholder="Kapı, motor, kart..."><label>Açıklama</label><textarea name="notes"></textarea><label>Kullanılan / değişen parça</label><input name="parts"><label>Ek ücret (₺)</label><input name="fee" type="number" min="0" step=".01" value="0"><label>Durum</label><select name="status"><option>Açık</option><option>İşlemde</option><option>Tamamlandı</option></select>`;
 if(type==='payment')body+=`<label>Tahsilat tutarı (₺) *</label><input name="amount" type="number" min=".01" step=".01" required><label>Ödeme yöntemi</label><select name="method"><option>Nakit</option><option>Banka / Havale</option></select><label>Açıklama</label><input name="note" placeholder="Örn. bakım ödemesi">`;
 body+=`<button style="width:100%;margin-top:8px">Kaydı kaydet</button></form>`}
 if(type==='billpayment'){let bill=db.bills.find(x=>x.id===id);if(!bill)return;title='Borç tahsilatı';body=`<div class="card"><b>${esc(bill.building)} · ${esc(bill.month)}</b><div class="meta">Kalan borç: ${money(bill.amount-bill.paid)}</div></div><form onsubmit="payBill(event,${id})"><label>Alınan ödeme (₺)</label><input name="amount" type="number" min=".01" max="${Math.max(0,bill.amount-bill.paid)}" step=".01" required><label>Ödeme yöntemi</label><select name="method"><option>Nakit</option><option>Banka / Havale</option></select><label>Açıklama</label><input name="note"><button style="width:100%">Tahsilatı kaydet</button></form>`}
 if(type==='material'){title='Malzeme ekle';body=`<form onsubmit="addMaterial(event)"><label>Malzeme adı *</label><input name="name" required><div class="grid"><div><label>Stok miktarı</label><input name="qty" type="number" min="0" value="0"></div><div><label>Birim</label><input name="unit" value="Adet"></div><div><label>Malzeme kodu</label><input name="code"></div><div><label>Asgari stok</label><input name="min" type="number" min="0" value="0"></div></div><button style="width:100%">Kaydet</button></form>`}
 if(type==='usage'){let m=db.materials.find(x=>x.id===id);if(!m)return;title='Malzeme kullanım kaydı';body=`<form onsubmit="useMaterial(event,${id})"><div class="meta">${esc(m.name)} · Stok: ${esc(m.qty)} ${esc(m.unit)}</div><label>Kullanılan miktar</label><input name="qty" type="number" min=".01" max="${m.qty}" step=".01" required><label>Bina</label><select name="buildingId"><option value="">Seçiniz</option>${optsBuildings()}</select><label>Asansör / açıklama</label><input name="note"><button style="width:100%">Kullanımı kaydet</button></form>`}
 openModal(title,body);
}
function refreshElevatorOptions(sel){let form=sel.form,el=form.querySelector('[name=elevatorId]');el.innerHTML='<option value="">Seçiniz</option>'+optsElevators(+sel.value)}
function addElevatorField(){document.getElementById('elevatorFields').insertAdjacentHTML('beforeend',`<div class="card"><label>Asansör adı / numarası</label><input name="label[]" value="Asansör ${document.querySelectorAll('#elevatorFields input[name=\'label[]\']').length+1}"><label>Marka / model</label><input name="brand[]"></div>`)}
function addBuilding(e){e.preventDefault();let f=new FormData(e.target),n=+f.get('elevators'),id=Date.now();let b={id,name:f.get('name'),district:f.get('district'),neighborhood:f.get('neighborhood'),address:f.get('address'),manager:f.get('manager'),phone:f.get('phone'),elevators:n,fee:f.get('fee'),pricing:f.get('pricing'),contract:f.get('contract')};db.buildings.push(b);for(let i=1;i<=n;i++)db.elevators.push({id:id+i,buildingId:id,label:'Asansör '+i,brand:''});save();closeModal();render()}
function saveElevators(e,bid){e.preventDefault();let f=new FormData(e.target),labels=f.getAll('label[]'),brands=f.getAll('brand[]');db.elevators=db.elevators.filter(x=>x.buildingId!==bid);labels.forEach((v,i)=>{if(v.trim())db.elevators.push({id:Date.now()+i,buildingId:bid,label:v,brand:brands[i]||''})});let b=building(bid);b.elevators=labels.filter(x=>x.trim()).length;save();closeModal();render()}
function addRecord(e,type){e.preventDefault();let f=new FormData(e.target),b=building(f.get('buildingId')),el=db.elevators.find(x=>x.id===+f.get('elevatorId'));let x={id:Date.now(),buildingId:b.id,building:b.name,elevatorId:el?.id||null,elevator:el?.label||'Genel',date:f.get('date'),staff:f.get('staff')};if(type==='maintenance')db.maintenance.push({...x,notes:f.get('notes'),status:f.get('status'),month:monthKey(f.get('date'))});if(type==='fault')db.faults.push({...x,type:f.get('type'),notes:f.get('notes'),parts:f.get('parts'),fee:f.get('fee'),status:f.get('status')});if(type==='payment')db.payments.push({...x,amount:f.get('amount'),method:f.get('method'),note:f.get('note')});save();closeModal();render()}
function payBill(e,id){e.preventDefault();let f=new FormData(e.target),bill=db.bills.find(x=>x.id===id),amount=+f.get('amount');if(amount>bill.amount-bill.paid){alert('Ödeme kalan borçtan fazla olamaz.');return}bill.paid+=amount;bill.status=bill.paid>=bill.amount?'Ödendi':'Kısmi ödendi';db.payments.push({id:Date.now(),building:bill.building,buildingId:bill.buildingId,date:today(),amount,method:f.get('method'),note:f.get('note')||bill.month,billId:id});save();closeModal();render()}
function addMaterial(e){e.preventDefault();let f=new FormData(e.target);db.materials.push({id:Date.now(),name:f.get('name'),qty:+f.get('qty'),unit:f.get('unit'),code:f.get('code'),min:+f.get('min')});save();closeModal();render()}
function useMaterial(e,id){e.preventDefault();let f=new FormData(e.target),m=db.materials.find(x=>x.id===id),qty=+f.get('qty');if(qty>m.qty){alert('Stok yetersiz.');return}m.qty-=qty;let b=building(f.get('buildingId'));db.usage.push({id:Date.now(),material:m.name,qty,unit:m.unit,date:today(),building:b?.name||'',note:f.get('note')});save();closeModal();render()}
function toggleStatus(type,id){let x=db[type].find(x=>x.id===id),states=type==='faults'?['Açık','İşlemde','Tamamlandı']:['Bekliyor','Tamamlandı','Gecikti'];x.status=states[(states.indexOf(x.status)+1)%states.length];save();render()}
function removeItem(type,id){if(!confirm('Bu kaydı silmek istediğine emin misin?'))return;if(type==='buildings'){db.elevators=db.elevators.filter(x=>x.buildingId!==id);db.maintenance=db.maintenance.filter(x=>x.buildingId!==id);db.faults=db.faults.filter(x=>x.buildingId!==id);db.bills=db.bills.filter(x=>x.buildingId!==id)}db[type]=db[type].filter(x=>x.id!==id);save();render()}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='ENTEGRE_GROUP_Yedek_'+today()+'.json';a.click();URL.revokeObjectURL(url)}
function restoreBackup(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.buildings||!x.maintenance)throw Error();if(!confirm('Mevcut telefondaki kayıtlar yedek dosyasıyla değiştirilsin mi?'))return;db={...fresh(),...x};save();render();alert('Yedek geri yüklendi.')}catch(err){alert('Yedek dosyası okunamadı.')} };r.readAsText(file)}
function saveStaff(){let v=document.getElementById('staffName').value.trim();if(v){db.staff=[v];save();alert('Personel adı kaydedildi.')} }
function resetAll(){if(confirm('Tüm bina, bakım, arıza, borç, tahsilat ve stok kayıtları kalıcı olarak silinsin mi?')){db=fresh();save();render()}}
document.querySelectorAll('.nav').forEach(x=>x.addEventListener('click',()=>{tab=x.dataset.tab;render()}));
render();
</script></body></html>
